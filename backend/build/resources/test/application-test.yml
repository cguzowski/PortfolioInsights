spring:
  datasource:
    url: jdbc:h2:mem:portfolio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS atlas_capital_intelligence
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: atlas_capital_intelligence
  flyway:
    enabled: true
    default-schema: atlas_capital_intelligence
    schemas: atlas_capital_intelligence
    create-schemas: true
